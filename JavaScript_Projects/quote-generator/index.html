<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quote-container" id="quote-container">
        <!-- Citação -->
        <div class="quote-text">
            <i class="fas fa-quote-left"></i>
            <span id="quote">Quem não tem colírio, usa óculos escuros.</span>
            <i class="fas fa-quote-right"></i>
        </div>
        <!-- Autor -->
        <div class="quote-author">
            <span id="author">Minha Vó</span>
        </div>
        <!-- Botões -->
        <div class="button-container">
            <!-- Link para a minha página do GitHub -->
            <button id="github-link">
                <i class="fab fa-github"></i>
            </button>
            <!-- Botão para gerar nova citação -->
            <button id="new-quote">
                Nova Citação
            </button>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer-creditos">
        <span>© 2026 JavaScript Web Projects: 20 Projects to Build Your Portfolio</span>
        <span class="divisor">•</span>
        <span><a href="https://www.flaticon.com/br/icones-gratis/console-de-jogo" title="console de jogo ícones">Flaticon criado por Magnific</a></span>
    </footer>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
